<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA VI </title>
<meta name="description" content="A quick checklist to help you get ready for GTA VI. Unofficial fan page.">
<meta name="theme-color" content="#0b1030">
<meta property="og:title" content="GTA VI Fan Checklist">
<meta property="og:description" content="A quick checklist to help you get ready for GTA VI.">
<meta property="og:image" content="hero.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1030;
    --navy-2:#141a45;
    --pink:#ff3d9a;
    --orange:#ff8a3d;
    --peach:#ffc48a;
    --text:#ffffff;
    --muted:#d9d6ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--navy);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
    /* Fallback sunset gradient if the image is missing */
    background:linear-gradient(180deg,#2a1b5c 0%,#b03d8c 45%,#ff7a59 75%,#ffb26b 100%);
  }
  /*
    HERO IMAGE
    To change it, replace hero.webp in this folder (same name),
    or change the src below to your own file.
  */
  .hero__img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:72% center; /* keeps the characters in frame on phones */
    z-index:0;
  }
  .hero::after{
    content:"";
    position:absolute;inset:0;
    z-index:1;
    background:
      linear-gradient(180deg,rgba(11,16,48,0) 25%,rgba(11,16,48,.55) 50%,rgba(11,16,48,.92) 72%,var(--navy) 100%);
  }

  .content{
    position:relative;
    z-index:2;
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:0 20px calc(28px + env(safe-area-inset-bottom));
    text-align:center;
  }
  /* live viewers box (hidden until a real count arrives) */
  .live{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:max-content;max-width:100%;
    margin:0 auto 14px;
    padding:9px 16px;
    border-radius:14px;
    background:rgba(11,16,48,.78);
    border:1px solid rgba(255,61,154,.5);
    box-shadow:0 6px 22px rgba(0,0,0,.35);
    backdrop-filter:blur(6px);
    font-size:14px;font-weight:600;color:var(--text);
  }
  .live[hidden]{display:none}
  .live b{font-size:16px;font-weight:800;color:var(--peach)}
  .live__dot{
    width:10px;height:10px;border-radius:50%;flex:none;
    background:#ff2e63;
    box-shadow:0 0 0 0 rgba(255,46,99,.7);
    animation:ping 1.6s ease-out infinite;
  }
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(255,46,99,.7)}
    100%{box-shadow:0 0 0 10px rgba(255,46,99,0)}
  }
  .label{
    display:inline-block;
    font-size:11px;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--peach);
    background:rgba(11,16,48,.7);
    border:1px solid rgba(255,196,138,.45);
    border-radius:999px;
    padding:7px 14px;
    margin-bottom:16px;
    backdrop-filter:blur(6px);
  }
  h1{
    font-family:Anton,Impact,"Arial Black",sans-serif;
    font-weight:400;
    font-size:clamp(44px,13vw,84px);
    line-height:.95;
    letter-spacing:.01em;
    text-transform:uppercase;
    background:linear-gradient(90deg,var(--pink) 0%,var(--orange) 60%,var(--peach) 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 3px 14px rgba(0,0,0,.55));
    margin-bottom:14px;
  }
  .desc{
    font-size:17px;
    line-height:1.5;
    color:var(--text);
    text-shadow:0 2px 10px rgba(0,0,0,.7);
    margin:0 auto 24px;
    max-width:30ch;
  }
  .btn{
    position:relative;
    overflow:hidden;
    display:block;
    width:100%;
    animation:glow 2.4s ease-in-out infinite;
    padding:19px 24px;
    border-radius:16px;
    font-family:Inter,system-ui,sans-serif;
    font-size:19px;
    font-weight:800;
    letter-spacing:.02em;
    color:#fff;
    text-decoration:none;
    background:linear-gradient(90deg,var(--pink),var(--orange));
    box-shadow:0 10px 30px rgba(255,61,154,.45),inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s ease,box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  /* light sweep across the button */
  .btn::before{
    content:"";
    position:absolute;top:0;left:-60%;
    width:45%;height:100%;
    background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);
    transform:skewX(-20deg);
    animation:shine 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shine{
    0%{left:-60%}
    55%,100%{left:130%}
  }
  @keyframes glow{
    0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(255,61,154,.45),inset 0 1px 0 rgba(255,255,255,.35)}
    50%{transform:scale(1.03);box-shadow:0 12px 42px rgba(255,138,61,.7),inset 0 1px 0 rgba(255,255,255,.35)}
  }
  .btn:hover{animation-play-state:paused;transform:translateY(-2px);box-shadow:0 14px 36px rgba(255,61,154,.6),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid var(--peach);outline-offset:3px}
  .note{
    font-size:13px;
    line-height:1.45;
    color:var(--muted);
    margin-top:12px;
  }

  footer{
    background:var(--navy);
    border-top:1px solid rgba(255,255,255,.08);
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    text-align:center;
    font-size:12px;
    line-height:1.5;
    color:#9a98b8;
  }

  /* Bigger screens: image fills, text sits lower-left of centre */
  @media (min-width:900px){
    .hero__img{object-position:center}
    .hero::after{
      background:
        linear-gradient(180deg,rgba(11,16,48,0) 35%,rgba(11,16,48,.8) 70%,var(--navy) 100%);
    }
    .content{padding-bottom:56px}
    .desc{font-size:19px}
  }
  @media (prefers-reduced-motion:reduce){
    .btn{transition:none;animation:none}
    .btn::before{animation:none;display:none}
  }
</style>
</head>
<body>

<main class="hero">
  <!-- HERO IMAGE: replace hero.webp with your own image (keep the same name) -->
  <img class="hero__img" src="hero.webp" alt="" fetchpriority="high">

  <div class="content">
    <!-- LIVE VIEWERS: shows a real count from Supabase Realtime. Stays hidden if not connected. -->
    <div class="live" id="live" hidden aria-live="polite">
      <span class="live__dot" aria-hidden="true"></span>
      <span><b id="liveCount">0</b> <span id="liveWord">people</span> viewing now</span>
    </div>

    <span class="label">GTA 6 Fan Page</span>
    <h1>GTA VI FREE DOWNLOAD KEYS</h1>
    <p class="desc">Click on the button to download GTA 6 for free</p>

    <!-- OGAds Direct Link (opens in the same tab) -->
    <a class="btn" href="https://apptrck.net/cl/i/m5nqq2">DOWNLOAD NOW</a>

    <p class="note">You have to complete one offer to download GTA 6</p>
  </div>
</main>

<footer>
 fan page.
</footer>

<!-- ===== LIVE VIEWER COUNT (Supabase Realtime Presence) =====
     Paste your Supabase project URL and publishable/anon key below.
     If these are empty, the box stays hidden. No fake numbers. -->
<script>
  window.LIVE_CONFIG = {
    supabaseUrl: "",
    supabaseKey: ""
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var cfg = window.LIVE_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseKey || !window.supabase) return;

  var box = document.getElementById("live");
  var countEl = document.getElementById("liveCount");
  var wordEl = document.getElementById("liveWord");

  var id;
  try { id = crypto.randomUUID(); } catch (e) { id = String(Date.now()) + Math.random().toString(36).slice(2); }

  var client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  var channel = client.channel("gta6-fan-viewers", { config: { presence: { key: id } } });

  channel
    .on("presence", { event: "sync" }, function(){
      var n = Object.keys(channel.presenceState()).length;
      if (n < 1) return;
      countEl.textContent = n;
      wordEl.textContent = n === 1 ? "person" : "people";
      box.hidden = false;
    })
    .subscribe(function(status){
      if (status === "SUBSCRIBED") channel.track({ joined: Date.now() });
      if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") box.hidden = true;
    });
})();
</script>

</body>
</html>
